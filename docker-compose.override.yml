# Local dev override.
#  1. Injects the mTLS certs that the mTLS commit made mandatory (./certs, git-ignored).
#  2. Fronts the stack with Velocity + ViaVersion so ANY client version can connect.
#
# Topology:  client (any version) -> velocity:25565 (+ViaVersion) -> hyperion-proxy -> bedwars (mTLS)
# Not for production use.
services:
  # Public entrypoint. Translates newer clients down to Hyperion's 1.20.1 (protocol 763).
  velocity:
    image: itzg/mc-proxy
    ports:
      - "25565:25565"
    environment:
      TYPE: VELOCITY
      VELOCITY_VERSION: latest
      # Drives which ViaVersion build is pulled from Modrinth. Set to the CLIENT version
      # you connect with; ViaVersion translates it down to Hyperion's 1.20.1 backend.
      MINECRAFT_VERSION: 26.1.2
      MEMORY: 512m
      # Auto-install ViaVersion (newer->older) + ViaBackwards (older->newer) from Modrinth.
      MODRINTH_PROJECTS: |
        viaversion
        viabackwards
      MODRINTH_LOADER: velocity
      MODRINTH_DOWNLOAD_DEPENDENCIES: required
    volumes:
      - ./velocity:/server
    networks:
      - proxy-network
    depends_on:
      - hyperion-proxy

  # Now internal-only: Velocity is the public face, so drop the host 25565 binding.
  hyperion-proxy:
    ports: !reset []
    expose:
      - "25565"
    volumes:
      - ./certs:/certs:ro
    environment:
      - HYPERION_PROXY_ROOT_CA_CERT=/certs/root_ca.crt
      - HYPERION_PROXY_CERT=/certs/proxy.crt
      - HYPERION_PROXY_PRIVATE_KEY=/certs/proxy_key.pem

  bedwars:
    build:
      # iacoder source for the AI agent sidecar's `sidecar-build` stage. The
      # agent crate itself now lives in this repo (crates/hyperion-ai-agent),
      # so only iacoder needs to come in as an external context.
      additional_contexts:
        iacoder: ../iacoder
    volumes:
      - ./certs:/certs:ro
      # bedwars embeds a proxy module that loads these from its CWD (/)
      - ./certs/root_ca.crt:/root_ca.crt:ro
      - ./certs/proxy.crt:/proxy.crt:ro
      - ./certs/proxy_key.pem:/proxy_private_key.pem:ro
      # custom local world (must contain region/); overrides the downloaded GenMap
      - ./map:/map:ro
      # Use the preset iacoder config (GLM/Z.AI providers + keys) for the AI
      # agent, overriding the stub baked into the image. Keys stay on the host,
      # not in the image. The sidecar reads /config.toml (HYPERION_AI_CONFIG).
      - ../iacoder/.iacoder/config.toml:/config.toml:ro
    environment:
      - BEDWARS_ROOT_CA_CERT=/certs/root_ca.crt
      - BEDWARS_CERT=/certs/bedwars.crt
      - BEDWARS_PRIVATE_KEY=/certs/bedwars_key.pem
      - HYPERION_MAP_DIR=/map
      # The AI agent sidecar reads this. Set it in your shell (or .env) before
      # `docker compose up`. Without it the sidecar exits and /ai stays off.
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      # NOTE: model selection comes from /config.toml's `default_model` (alias
      # "claude"). Do NOT set HYPERION_AI_MODEL to a bare model id like
      # "claude-sonnet-4-5" — that's not a valid selection. To override, set it
      # to a config alias ("claude") or "<provider>/<model>"
      # ("anthropic/claude-sonnet-4-5"), e.g.:
      #   - HYPERION_AI_MODEL=anthropic/claude-sonnet-4-5
      # The host reaches the LLM APIs through a local proxy (Clash/mihomo on
      # *:7897). The container resolves those domains to fake-IPs and can't
      # tunnel itself, so route the sidecar's HTTPS (reqwest) through the host
      # proxy. Internal/loopback traffic bypasses it via NO_PROXY.
      - HTTP_PROXY=http://host.docker.internal:7897
      - HTTPS_PROXY=http://host.docker.internal:7897
      - ALL_PROXY=http://host.docker.internal:7897
      - http_proxy=http://host.docker.internal:7897
      - https_proxy=http://host.docker.internal:7897
      - all_proxy=http://host.docker.internal:7897
      - NO_PROXY=localhost,127.0.0.1,hyperion-proxy,bedwars,velocity,.local
      - no_proxy=localhost,127.0.0.1,hyperion-proxy,bedwars,velocity,.local
      # Verbose AI logging so /ai model requests/responses show up in the logs.
      # reqwest=debug surfaces the outbound HTTP call to the LLM (URL, proxy use,
      # status); hyper=info keeps the byte-level noise down.
      - RUST_LOG=info,hyperion_ai_agent=debug,iacoder_agent=debug,iacoder_core=debug,iacoder_tools=debug,reqwest=debug,rig=debug,rig_core=debug,hyper=info
