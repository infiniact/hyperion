# AI agent config for the in-game `/ai` assistant (iacoder Config format).
#
# Baked into the bedwars image at /config.toml and loaded directly by the
# sidecar (HYPERION_AI_CONFIG overrides the path). It selects providers + models;
# the model can also be overridden at runtime with HYPERION_AI_MODEL
# (docker-compose sets it to "deepseek-flash").
#
# SECRETS: every api_key uses ${ENV:VAR}, so keys live ONLY in the environment —
# never in this file, the repo, or the image. Set the referenced vars on the
# bedwars service (docker-compose passes DEEPSEEK_API_KEY / ZHIPU_API_KEY /
# ZAI_API_KEY through from your shell or .env).

default_model = "deepseek-flash"

[default_models]
flash = "deepseek-flash"

[providers.deepseek]
api_key = "${ENV:DEEPSEEK_API_KEY}"

[providers.zhipu_coding]
api_key = "${ENV:ZHIPU_API_KEY}"

[providers.zai]
api_key = "${ENV:ZAI_API_KEY}"

# Fast text model — the in-game /ai assistant uses this by default.
[models.deepseek-flash]
provider = "deepseek"
model    = "deepseek-v4-flash"

# Stronger reasoning model (set HYPERION_AI_MODEL=glm-coding to use it).
[models.glm-coding]
provider = "zhipu_coding"
model    = "glm-5.1"

# Vision model — for the future image-recognition step (layer 2 of /ai builds).
[models.glm-vision]
provider = "zai"
model    = "glm-5v-turbo"
